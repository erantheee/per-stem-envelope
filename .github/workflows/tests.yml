name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: C port parity
        run: make -C variants/s3 check
      - name: Demo runs
        run: python examples/synthetic_demo.py --out build
      # Audio is forbidden outright; weights are allowed only under weights/ and
      # only when declared in weights/MANIFEST.json — tests/test_weights.py owns
      # that rule, this is the coarse shell-level guard.
      - name: No audio committed
        run: "! git ls-files | grep -Ei '\\.(wav|flac|mp3|ogg|m4a)$'"
